<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../public/images/favicon-32x32.png"
    />
    <title>Four card feature section</title>
  </head>
  <body>
    <header>
      <h1>
        Reliable, efficient delivery
        <br />
        <strong>Powered by Technology</strong>
      </h1>
      <p>
        Our Artificial Intelligence powered tools use millions of project data
        points to ensure that your project is successful
      </p>
    </header>
    <main>
      <wc-card
        title="Supervisor"
        description="Monitors activity to identify project roadblocks"
      >
        <img src="../public/images/icon-supervisor.svg" alt="icon" />
      </wc-card>
      <wc-card
        title="Team Builder"
        description="Scans our talent network to create the optimal team for your project"
      >
        <img src="../public/images/icon-team-builder.svg" alt="icon" />
      </wc-card>
      <wc-card
        title="Karma"
        description="Regularly evaluates our talent to ensure quality"
      >
        <img src="../public/images/icon-karma.svg" alt="icon" />
      </wc-card>
      <wc-card
        title="Calculator"
        description="Uses data from past projects to provide better delivery estimates"
      >
        <img src="../public/images/icon-calculator.svg" alt="icon" />
      </wc-card>
    </main>
    <script type="module" src="./card.ts"></script>
  </body>
</html>
