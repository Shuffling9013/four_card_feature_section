<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Four card feature section</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../public/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="index.css" />
    <script type="module" src="./card-component.ts"></script>
  </head>
  <body>
    <header>
      <h1>
        Reliable, efficient delivery
        <br />
        <strong>Powered by Technology</strong>
      </h1>
      <p>
        Our Artificial Intelligence powered tools use millions of project data
        points to ensure that your project is successful
      </p>
    </header>
    <main>
      <card-component
        title="Supervisor"
        desc="Monitors activity to identify project roadblocks"
        theme="cyan"
      >
        <img src="../public/images/icon-supervisor.svg" alt="icon" />
      </card-component>
      <card-component
        title="Team Builder"
        desc="Scans our talent network to create the optimal team for your project"
        theme="red"
      >
        <img src="../public/images/icon-team-builder.svg" alt="icon" />
      </card-component>
      <card-component
        title="Karma"
        desc="Regularly evaluates our talent to ensure quality"
        theme="orange"
      >
        <img src="../public/images/icon-karma.svg" alt="icon" />
      </card-component>
      <card-component
        title="Calculator"
        desc="Uses data from past projects to provide better delivery estimates"
        theme="blue"
      >
        <img src="../public/images/icon-calculator.svg" alt="icon" />
      </card-component>
    </main>
  </body>
</html>
